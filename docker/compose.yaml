services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: brainos-postgres

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - brainos-postgres-data:/var/lib/postgresql/data

    networks:
      - brainos-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainos -d brainos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: brainos-pgadmin

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@brainos.com
      PGADMIN_DEFAULT_PASSWORD: BrainOS@2026

    ports:
      - "5050:80"

    volumes:
      - brainos-pgadmin-data:/var/lib/pgadmin

    networks:
      - brainos-network

volumes:
  brainos-postgres-data:
  brainos-pgadmin-data:

networks:
  brainos-network:
    driver: bridge
    